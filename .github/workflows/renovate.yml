name: Renovate

# Deterministic dependency-update PRs (same pattern as Lou-Lou-CH/lou-lou and
# sobatista-vulnerable-apis/base-project). Policy lives in the shared preset this
# repo's renovate.json extends; repo-specific scope lives in renovate.json itself.
#
# Uses a PAT (RENOVATE_TOKEN), not GITHUB_TOKEN, so the PRs it opens trigger this
# repo's own CI like any other PR (GITHUB_TOKEN-authored PRs do not trigger
# workflows). Without the secret the job is a no-op notice, never a failure.
#
# Runs every 6 hours so security PRs (vulnerabilityAlerts, "at any time") are not
# held back a week and green automerge-eligible PRs merge on the next pass; routine
# PRs are still limited to the Monday-morning window by the preset's `schedule`.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

# One run at a time; a manual run waits for the scheduled one instead of racing it.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for RENOVATE_TOKEN
        id: check
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
        run: |
          if [ -n "$RENOVATE_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::RENOVATE_TOKEN not set, skipping. Needs a fine-grained PAT on this repo with contents, pull-requests, issues, workflows and commit-statuses write, plus Dependabot alerts read."
            echo "has_token=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        if: steps.check.outputs.has_token == 'true'
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
