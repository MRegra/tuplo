name: Security

# Supply-chain and code scanning for the public repo:
#   - CodeQL (Java) SAST, results in the Security tab
#   - gitleaks secret scan over the full git history
#   - dependency review of every PR's dependency diff
# Actions are pinned by commit SHA (Renovate keeps them current, see renovate.json).
# Runs on the home self-hosted runners (server-dev1/server-dev2, labels: self-hosted, Linux, X64,
# home). This repo is public: fork PRs require the owner's approval before any workflow run
# (repo setting "Fork pull request workflows from outside collaborators" = all external
# contributors) — keep that setting on, since jobs here execute on our own infrastructure.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1' # weekly, so new CodeQL queries run even when nothing is merged

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read          # CodeQL reads this run's metadata
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:java-kotlin

  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: '8.30.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the tip
          persist-credentials: false
      - name: Install gitleaks (pinned version, checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          workdir="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${workdir}"
          curl -fsSL -o "${workdir}/${archive}" "${base}/${archive}"
          curl -fsSL -o "${workdir}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "${workdir}" && grep " ${archive}\$" checksums.txt | sha256sum --check --strict -)
          tar -xzf "${workdir}/${archive}" -C "${workdir}" gitleaks
          echo "${workdir}" >> "${GITHUB_PATH}"
      - name: Scan git history
        run: gitleaks git --no-banner --redact --exit-code 1 .

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
