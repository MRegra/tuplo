name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  no-draft-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fail if a draft post is committed
        run: bash scripts/check-no-draft-posts.sh
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn -B --no-transfer-progress verify
